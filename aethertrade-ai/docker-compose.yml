# AetherTrade AI — local stack: TimescaleDB, Redis, one-shot migrations, API and web terminal.
#
#   cp .env.example .env   # then fill in the required secrets
#   docker compose up --build
#   docker compose run --rm api python -m app.cli create-user --email you@example.com --name "Owner"
#
# Ports bind to 127.0.0.1 only. This file targets development; production hardening (TLS reverse
# proxy, separate DB roles, backups) is Phase 7.

name: aethertrade

x-backend-env: &backend-env
  AETHER_ENVIRONMENT: ${AETHER_ENVIRONMENT:-development}
  AETHER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aethertrade}
  AETHER_REDIS_URL: redis://redis:6379/0
  AETHER_JWT_SECRET: ${AETHER_JWT_SECRET:?set AETHER_JWT_SECRET in .env}
  AETHER_SECRETS_ENCRYPTION_KEYS: ${AETHER_SECRETS_ENCRYPTION_KEYS:?set AETHER_SECRETS_ENCRYPTION_KEYS in .env}
  AETHER_COOKIE_SECURE: ${AETHER_COOKIE_SECURE:-false}
  AETHER_TRUSTED_HOSTS: ${AETHER_TRUSTED_HOSTS:-["*"]}
  AETHER_RATE_LIMIT_BACKEND: redis
  AETHER_LOG_LEVEL: ${AETHER_LOG_LEVEL:-INFO}
  AETHER_LOG_JSON: "true"
  AETHER_ALLOW_FIXTURE_DATA: "false"

services:
  db:
    image: timescale/timescaledb:2.32.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aethertrade}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${AETHER_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${AETHER_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: aethertrade-api:dev
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: aethertrade-api:dev
    build:
      context: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AETHER_API_HOST_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    image: aethertrade-web:dev
    build:
      context: ./frontend
      args:
        AETHER_BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AETHER_WEB_HOST_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
