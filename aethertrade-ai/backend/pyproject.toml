[project]
name = "aethertrade-backend"
version = "0.1.0"
description = "AetherTrade AI — quantitative research and paper-trading platform (API, workers, research engine)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "structlog>=26.1",
    "pyjwt>=2.15",
    "argon2-cffi>=25.1",
    "cryptography>=50.0",
    "redis>=8.1",
    "python-multipart>=0.0.20",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "DTZ", "PT", "T20"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in defaults

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; prose in docstrings/comments may run slightly longer.
max-line-length = 105

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"app/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/database/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]
